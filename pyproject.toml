[project]
name = "brokenspoke-analyzer"
dynamic = ["version"]
description = "Run a BNA analysis locally."
authors = [
  { name = "Rémy Greinhofer", email = "remy.greinhofer@gmail.com" },
  { name = "Luis Alvergue", email = "lalver1@gmail.com" },
  { name = "Grace Stonecipher", email = "grace@peopleforbikes.org" },
]
requires-python = "~=3.13.0"
license = "MIT"

[tool.uv.workspace]
members = [
  "packages/brokenspoke-analyzer-lib",
  "packages/brokenspoke-analyzer-cli",
]

[tool.uv]
# The root is a virtual project: it declares the workspace and the shared
# tooling configuration, but is never built, installed nor published.
package = false

[tool.uv.sources]
brokenspoke-analyzer-lib = { workspace = true }
brokenspoke-analyzer-cli = { workspace = true }

[dependency-groups]
dev = [
  "brokenspoke-analyzer-cli",
  "brokenspoke-analyzer-lib",
  "bpython>=0.26,<0.27",
  "furo>=2025.12.19,<2026",
  "isort>=8.0.1,<9",
  "jupyterlab>=4.6.3,<5",
  "minijinja>=2.22.0",
  "myst-parser>=5.1.0,<6",
  "pandas-stubs>=3.0.5.260730,<4",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0,<8",
  "pytest-mock>=3.15.1,<4",
  "pytest-rerunfailures~=16.6",
  "pytest-socket>=0.8.1,<0.9",
  "pytest-xdist>=3.8.0,<4",
  "pytest>=9.1.1,<10",
  "ruff>=0.16.4",
  "sphinx-autobuild>=2025.8.25,<2026",
  "sphinx-autodoc-typehints>=3.13.2,<4",
  "sphinx-copybutton>=0.5.2,<0.6",
  "Sphinx>=9.1.0,<10",
  "sqlfluff>=4.3.0,<5",
  "ty>=0.0.74",
  "types-beautifulsoup4>=4.12.0.20250516",
  "types-boto3>=1.43.77",
  "types-colorama>=0.4.15.20260508,<0.5",
  "types-decorator>=5.2.0.20260712,<6",
  "types-jsonschema>=4.26.0.20260518,<5",
  "types-pygments>=2.21.0.20260819,<3",
  "types-python-slugify>=8.0.2.20240310,<9",
  "types-six>=1.17.0.20260724,<2",
  "xdoctest>=1.3.2,<2",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.isort]
profile = "black"
force_grid_wrap = 2
known_first_party = ["brokenspoke_analyzer_cli", "brokenspoke_analyzer_lib"]

[tool.coverage.run]
omit = [
  "*/__init__.py",
  "*/brokenspoke_analyzer_cli/*",
  "*/brokenspoke_analyzer_lib/constant.py",
  "*/brokenspoke_analyzer_lib/core/compute.py",
  "*/brokenspoke_analyzer_lib/core/downloader.py",
  "*/brokenspoke_analyzer_lib/core/ingestor.py",
  "*/brokenspoke_analyzer_lib/database/*",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-p no:warnings --cov-report term-missing --cov-report html --xdoctest"
testpaths = [
  "packages/brokenspoke-analyzer-lib/tests",
  "packages/brokenspoke-analyzer-cli/tests",
]
markers = [
  "australia",
  "canada",
  "europe",
  "france",
  "spain",
  "usa",
  "main: main test suite",
  "xs: runs under 5min",
  "s: runs under 15min",
  "m: runs under 60min (1h)",
  "l: runs under 180min (2h)",
  "xl: runs under 360min (6h)",
  "xxl: runs under 720min (12h / 1/2day)",
]

[tool.ruff]
# The workspace members live under packages/*/src, so ruff needs to be told
# where first-party code is to keep its import sorting in sync with isort.
src = [
  "packages/brokenspoke-analyzer-cli/src",
  "packages/brokenspoke-analyzer-lib/src",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # any-type
  "COM812",  # missing-trailing-comma
  "CPY001",  # missing-copyright-notice
  "EM101",   # raw-string-in-exception
  "EM102",   # f-string-in-exception
  "FIX",     # flake8-fixme
  "INP001",  # implicit-namespace-package
  "PLR0913", # too-many-arguments
  "PLR0917", # too-many-positional-arguments -- Remove before releasing 4.0.0
  "S603",    # subprocess-without-shell-equals-true
  "S607",    # start-process-with-partial-path
  "S608",    # hardcoded-sql-expression
  "SLF001",  # private-member-access
  "TD003",   # missing-todo-link
  "TRY003",  # raise-vanilla-args
]

[tool.ruff.lint.isort]
known-first-party = ["brokenspoke_analyzer_cli", "brokenspoke_analyzer_lib"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
  "ANN201",  # missing-return-type-undocumented-public-function
  "D101",    # undocumented-public-class
  "D102",    # undocumented-public-method
  "D103",    # undocumented-public-function
  "D105",    # undocumented-magic-method
  "D107",    # undocumented-public-init
  "PLR2004", # magic-value-comparison
  "PYI034",  # non-self-return-type
  "S101",    # assert
  "T201",    # print
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.sqlfluff.core]
dialect = "postgres"
exclude_rules = "RF01, PG01"
large_file_skip_byte_limit = 0
processes = 0
templater = "placeholder"

[tool.sqlfluff.templater.placeholder]
param_style = "colon"
block_road_buffer = 15
block_road_min_length = 30
city_default = 30
class = "primary"
cluster_tolerance = 50
core_services = 99
default_facility_width = 5
default_lanes = 2
default_parking = 1
default_parking_width = 8
default_roadway_width = 27
default_speed = 40
nb_boundary_buffer = 2680
nb_max_trip_distance = 2680
nb_output_srid = 32613
opportunity = 99
people = 99
primary_lanes = 2
primary_speed = 40
recreation = 99
retail = 99
secondary_lanes = 2
secondary_speed = 40
state_default = 35
thread_no = 0
thread_num = 1
tertiary_lanes = 1
tertiary_speed = 30
total = 99
transit = 99

[tool.sqlfluff.rules.capitalisation.functions]
ignore_words_regex = "ST_."

[tool.sqlfluff.rules.layout.long_lines]
ignore_comment_lines = true

[tool.ty.src]
exclude = ["boto3", "geopandas", "osmnx", "shapely", "us"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
