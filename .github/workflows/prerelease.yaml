name: prerelease

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-*"

# Every job is granted only the permissions it needs.
permissions:
  # This is required for actions/checkout.
  contents: read

jobs:
  docker:
    permissions:
      # This is required for actions/checkout.
      contents: read
      # This is required for requesting the JWT.
      id-token: write
      # This is required to publish the image (to ghcr.io when enabled).
      packages: write
    uses: PeopleForBikes/.github/.github/workflows/docker-build-publish-ghcr.yml@main
    with:
      push-to-ghcr: false
      push-to-ecr: true
      aws-region: us-west-2
    secrets:
      github-role: ${{ secrets.FEDERATED_GITHUB_ROLE_ARN_STAGING }}
