name: e2e

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # Runs on `main` seed the OSM cache: caches created by a pull request are only
  # visible to that pull request, whereas caches created on `main` are visible
  # to every pull request. The schedule keeps the cache from being evicted
  # (GitHub drops entries that are not accessed for 7 days).
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

env:
  TEST_TAG: test/brokenspoke-analyzer:test
  TEST_COUNTRY: "united states"
  TEST_STATE: "new mexico"
  TEST_CITY: "santa rosa"
  TEST_FIPS: "3570670"
  # The OSM region file is downloaded from Geofabrik once, then cached, so the
  # test jobs never hit Geofabrik themselves. The data does not need to be
  # fresh: to refresh it, bump the cache key suffix.
  OSM_CACHE_KEY: e2e-osm-new-mexico-v2
  OSM_URL: https://download.geofabrik.de/north-america/us/new-mexico/new-mexico-latest.osm.pbf

jobs:
  osm-data:
    runs-on: ubuntu-24.04
    steps:
      - name: Restore the cached OSM region file
        id: restore-osm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bna-cache/osm
          key: ${{ env.OSM_CACHE_KEY }}
      - name: Download the OSM region file
        if: steps.restore-osm.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p bna-cache/osm
          cd bna-cache/osm
          for url in "${OSM_URL}.md5" "${OSM_URL}"; do
            curl --fail --location --silent --show-error \
              --connect-timeout 30 --retry 5 --retry-all-errors --retry-delay 30 \
              --remote-name "${url}"
          done
          md5sum --check "$(basename "${OSM_URL}").md5"
          ls -lh
      - name: Save the OSM region file to the cache
        if: steps.restore-osm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bna-cache/osm
          key: ${{ env.OSM_CACHE_KEY }}

  osm2pgrouting3:
    runs-on: ubuntu-24.04
    steps:
      - name: install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          expat \
          git \
          libboost-dev \
          libboost-program-options-dev \
          libexpat1-dev \
          libpqxx-dev
      - name: build osm2pgrouting 3
        run: |
          git clone https://github.com/pgRouting/osm2pgrouting.git
          cd osm2pgrouting
          cmake -H. -Bbuild
          cd build
          make
          pwd
          ls -lh
          echo $PATH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: osm2pgrouting3
          path: osm2pgrouting/build/osm2pgrouting
          if-no-files-found: error

  integration:
    runs-on: ubuntu-24.04
    needs:
      - osm-data
      - osm2pgrouting3

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres"

    services:
      postgres:
        image: ghcr.io/gui/pgrouting:18.1-trixie-postgis-3.6.1-pgrouting-4.0.0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 #v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
          osm2pgsql osmctools osmium-tool postgresql-client postgis libpqxx-7.8t64

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osm2pgrouting3
          path: /home/runner/.local/bin/
      - name: Set osm2pgrouting permissions
        run: chmod 755 /home/runner/.local/bin/osm2pgrouting
      - name: Verify osm2pgrouting installation
        run: |
          ls -lh /home/runner/.local/bin/
          which osm2pgrouting
          osm2pgrouting --version
      - name: Setup the project
        run: uv sync --all-extras --dev

      - name: Configure Docker
        run: |
          uv run bna configure docker
      - name: Restore the cached OSM region file
        id: restore-osm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bna-cache/osm
          key: ${{ env.OSM_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Prepare the files for the analysis
        run: |
          mkdir -p "${{ runner.temp }}/bna-cache"
          uv run bna prepare --cache-dir "${{ runner.temp }}/bna-cache" "${{ env.TEST_COUNTRY }}" "${{ env.TEST_CITY }}" "${{ env.TEST_STATE }}" "${{ env.TEST_FIPS }}"

      - name: Import the files for the analysis
        run: |
          uv run bna import all "${{ env.TEST_COUNTRY }}" "${{ env.TEST_CITY }}" "${{ env.TEST_STATE }}"  "${{ env.TEST_FIPS }}" --data-dir data/santa-rosa-new-mexico-united-states

      - name: Compute the analysis
        run: |
          uv run bna compute "${{ env.TEST_COUNTRY }}" "${{ env.TEST_CITY }}" "${{ env.TEST_STATE }}" --data-dir data/santa-rosa-new-mexico-united-states

      - name: Run integration tests
        run: |
          set -x
          echo "List tables for debugging purpose."
          psql -c "\d" $DATABASE_URL

          echo "Ensure neighborhood_overall_scores table contains 23 records."
          ACTUAL=$(psql -t -c "SELECT COUNT(*) FROM neighborhood_overall_scores;" $DATABASE_URL)
          test $ACTUAL -eq 23

  docker-integration:
    runs-on: ubuntu-latest
    needs: osm-data

    env:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/postgres"

    services:
      postgres:
        image: ghcr.io/gui/pgrouting:18.1-trixie-postgis-3.6.1-pgrouting-4.0.0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract repository name
        id: repo-name
        run: echo "repo_name=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
      - name: Configure PostgreSQL
        run: >
          docker run --rm --network ${{ job.services.postgres.network }} -e DATABASE_URL
          ${{ env.TEST_TAG }} -vv configure custom 4 4096 postgres
      - name: Restore the cached OSM region file
        id: restore-osm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bna-cache/osm
          key: ${{ env.OSM_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Create the cache directory
        # Must exist beforehand, otherwise Docker creates it as root.
        run: mkdir -p "${{ runner.temp }}/bna-cache"
      - name: Run full analysis
        run: >
          docker run --rm --network ${{ job.services.postgres.network }} -u "$(id
          -u):$(id -g)" -v "${{ runner.temp }}/bna-cache:/cache" -e DATABASE_URL
          ${{ env.TEST_TAG }} -vv run --cache-dir /cache "${{ env.TEST_COUNTRY }}"
          "${{ env.TEST_CITY }}" "${{ env.TEST_STATE }}" "${{ env.TEST_FIPS }}"
      - name: Export the results
        run: >
          docker run --rm --network ${{ job.services.postgres.network }} -u $(id
          -u):$(id -g) -v ${PWD}:/usr/src/app/results -e DATABASE_URL ${{ env.TEST_TAG
          }} -vv export local-custom .
      # - name: Asserts
      #   run: |
      #     ls
      #     echo "Ensure neighborhood_overall_scores table contains 23 records + 1 header line."
      #     x=$(wc -l < "neighborhood_overall_scores.csv")
      #     test $x -eq 24
