name: e2e

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  TEST_TAG: test/brokenspoke-analyzer:test
  TEST_COUNTRY: "united states"
  TEST_STATE: "new mexico"
  TEST_CITY: "santa rosa"
  TEST_FIPS: "3570670"

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 #v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: install dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
          osmctools osmium-tool
      - name: Setup the project
        run: uv sync --all-extras --dev

      - name: Run the full analysis
        run: >
          uv run bna -vv run "${{ env.TEST_COUNTRY }}" "${{ env.TEST_CITY }}"
          "${{ env.TEST_STATE }}" "${{ env.TEST_FIPS }}"

      - name: Run integration tests
        run: |
          set -x
          scores=$(find results -name overall_scores.csv | head -1)
          echo "Ensure ${scores} contains 23 records + 1 header line."
          test "$(wc -l < "${scores}")" -eq 24

          echo "Ensure the published layers are all present."
          dir=$(dirname "${scores}")
          for layer in ways census_blocks ways_intersections boundary; do
            test -f "${dir}/${layer}.geojson"
          done

  docker-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract repository name
        id: repo-name
        run: echo "repo_name=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.TEST_TAG }}
      - name: Run the full analysis
        run: >
          docker run --rm -u $(id -u):$(id -g) -v ${PWD}/results:/usr/src/app/results
          ${{ env.TEST_TAG }} -vv run "${{ env.TEST_COUNTRY }}" "${{ env.TEST_CITY }}"
          "${{ env.TEST_STATE }}" "${{ env.TEST_FIPS }}"
      - name: Asserts
        run: |
          scores=$(find results -name overall_scores.csv | head -1)
          echo "Ensure ${scores} contains 23 records + 1 header line."
          test "$(wc -l < "${scores}")" -eq 24
