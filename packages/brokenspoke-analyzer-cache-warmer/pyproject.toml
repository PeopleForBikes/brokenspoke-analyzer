[project]
name = "brokenspoke-analyzer-cache-warmer"
dynamic = ["version"]
description = "Pre-populate the BNA analyzer cache."
authors = [
  { name = "Rémy Greinhofer", email = "remy.greinhofer@gmail.com" },
  { name = "Luis Alvergue", email = "lalver1@gmail.com" },
  { name = "Grace Stonecipher", email = "grace@peopleforbikes.org" },
]
requires-python = "~=3.13.0"
license = "MIT"
dependencies = [
  "aiohttp>=3.14.5,<4",
  "brokenspoke-analyzer-cli",
  "brokenspoke-analyzer-lib",
  "pycountry>=26.2.16",
  "pyrosm>=0.26.0",
  "rich>=15.0.0,<16",
  "typer>=0.27.3,<0.28",
  "us>=3.2.0,<5",
]

[project.scripts]
bna-cache-warmer = "brokenspoke_analyzer_cache_warmer.main:app"

[tool.uv.sources]
brokenspoke-analyzer-cli = { workspace = true }
brokenspoke-analyzer-lib = { workspace = true }

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.coverage.run]
omit = ["*/__init__.py", "*/brokenspoke_analyzer_cache_warmer/*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-p no:warnings --cov-report term-missing --cov-report html --xdoctest"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
