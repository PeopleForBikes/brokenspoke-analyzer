[project]
name = "bna-cache-warmer"
dynamic = ["version"]
description = "Pre-populate the BNA analyzer cache."
authors = [
  { name = "Rémy Greinhofer", email = "remy.greinhofer@gmail.com" },
  { name = "Luis Alvergue", email = "lalver1@gmail.com" },
  { name = "Grace Stonecipher", email = "grace@peopleforbikes.org" },
]
requires-python = "~=3.15.0"
license = "MIT"
dependencies = [
  "aiohttp>=3.14.5,<4",
  "bna-cli",
  "bna-lib",
  "pycountry>=26.2.16",
  "pyrosm>=0.26.0",
  "rich>=15.0.0,<16",
  "typer>=0.29.2,<0.30",
  "us>=3.2.0,<5",
]

[project.scripts]
bna-cache-warmer = "bna.cache_warmer.main:app"

[tool.uv.sources]
bna-cli = { workspace = true }
bna-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
# bna is a namespace package shared by every member: hatchling cannot detect
# it, and no member may ship src/bna/__init__.py.
packages = ["src/bna"]

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-p no:warnings --cov-report term-missing --cov-report html --xdoctest"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
