[project]
name = "bna-cli"
dynamic = ["version"]
description = "Command line frontend running a BNA analysis locally."
authors = [
  { name = "Rémy Greinhofer", email = "remy.greinhofer@gmail.com" },
  { name = "Luis Alvergue", email = "lalver1@gmail.com" },
  { name = "Grace Stonecipher", email = "grace@peopleforbikes.org" },
]
requires-python = "~=3.15.0"
license = "MIT"
dependencies = [
  "aiohttp>=3.14.5,<4",
  "bna-lib",
  "geopandas>=1.1.4,<2",
  "loguru>=0.7.3,<0.9",
  "pycountry>=26.2.16",
  "rich>=15.0.0,<16",
  "typer>=0.29.2,<0.30",
]

[project.scripts]
bna = "bna.cli.root:app"

[tool.uv.sources]
bna-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
# bna is a namespace package shared by every member: hatchling cannot detect
# it, and no member may ship src/bna/__init__.py.
packages = ["src/bna"]

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-p no:warnings --cov-report term-missing --cov-report html --xdoctest"
testpaths = ["src", "tests"]
markers = [
  "australia",
  "canada",
  "europe",
  "france",
  "spain",
  "usa",
  "main: main test suite",
  "xs: runs under 5min",
  "s: runs under 15min",
  "m: runs under 60min (1h)",
  "l: runs under 180min (2h)",
  "xl: runs under 360min (6h)",
  "xxl: runs under 720min (12h / 1/2day)",
]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"
