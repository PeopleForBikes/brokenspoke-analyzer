[project]
name = "bna-batch"
dynamic = ["version"]
description = "Run the BNA analysis for a batch of cities."
authors = [
  { name = "Rémy Greinhofer", email = "remy.greinhofer@gmail.com" },
  { name = "Luis Alvergue", email = "lalver1@gmail.com" },
  { name = "Grace Stonecipher", email = "grace@peopleforbikes.org" },
]
requires-python = "~=3.15.0"
license = "MIT"
dependencies = [
  "bna-cli",
  "bna-lib",
  "typer>=0.29.2,<0.30",
]

[project.scripts]
bna-batch = "bna.batch.main:app"

[tool.uv.sources]
bna-cli = { workspace = true }
bna-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
# bna is a namespace package shared by every member: hatchling cannot detect
# it, and no member may ship src/bna/__init__.py.
packages = ["src/bna"]

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-p no:warnings --cov-report term-missing --cov-report html --xdoctest"
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"
