[project]
name = "brokenspoke-analyzer-lib"
dynamic = ["version"]
description = "Core functionality of the BNA analysis."
authors = [
  { name = "Rémy Greinhofer", email = "remy.greinhofer@gmail.com" },
  { name = "Luis Alvergue", email = "lalver1@gmail.com" },
  { name = "Grace Stonecipher", email = "grace@peopleforbikes.org" },
]
requires-python = "~=3.13.0"
license = "MIT"
dependencies = [
  "aiohttp>=3.14.3,<4",
  "beautifulsoup4>=4.15.0",
  "boto3>=1.43.77,<2",
  "geopandas>=1.1.4,<2",
  "loguru>=0.7.3,<0.8",
  "numpy>=2.5.2",
  "obstore>=0.11.0",
  "osmnx>=2.1.1,<3",
  "platformdirs>=4.11.3",
  "pyrosm>=0.13.1",
  "python-dotenv>=1.2.3,<2",
  "python-slugify>=8.0.4,<9",
  "rasterio>=1.5.1",
  "shapely>=2.1.2",
  "sqlalchemy[asyncio, postgresql_psycopg]>=2.0.52,<3",
  "tenacity>=9.1.4,<10",
  "us>=3.2.0,<4",
  "yarl>=1.24.5",
]

[tool.hatch.version]
path = "../../VERSION"
pattern = "(?P<version>.+)"

[tool.coverage.run]
omit = [
  "*/__init__.py",
  "*/brokenspoke_analyzer_lib/constant.py",
  "*/brokenspoke_analyzer_lib/core/compute.py",
  "*/brokenspoke_analyzer_lib/core/downloader.py",
  "*/brokenspoke_analyzer_lib/core/ingestor.py",
  "*/brokenspoke_analyzer_lib/database/*",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-p no:warnings --cov-report term-missing --cov-report html --xdoctest"
testpaths = ["tests"]
markers = [
  "australia",
  "canada",
  "europe",
  "france",
  "spain",
  "usa",
  "main: main test suite",
  "xs: runs under 5min",
  "s: runs under 15min",
  "m: runs under 60min (1h)",
  "l: runs under 180min (2h)",
  "xl: runs under 360min (6h)",
  "xxl: runs under 720min (12h / 1/2day)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
